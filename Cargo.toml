[package]
name = "cedar"
version = "0.1.0"
edition = "2021"
authors = ["Cedar Contributors"]
description = "Google Docs ⇄ Local Editor Compatibility Layer"
license = "MIT"

[[bin]]
name = "cedar"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"

# HTTP client and server
reqwest = { version = "0.12", features = ["json", "stream"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "0.2"

# JSON-RPC server
jsonrpsee = { version = "0.24", features = ["server", "client", "macros"] }

# OAuth2 and authentication
oauth2 = "4.4"
url = "2.5"
urlencoding = "2.1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling and logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
toml = "0.8"
dirs = "5.0"

# Text processing and diff algorithms
similar = "2.6"
unicode-segmentation = "1.11"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
bytes = "1.7"
futures = "0.3"

[dev-dependencies]
tempfile = "3.12"
tokio-test = "0.4"
proptest = "1.5"
